name: Build complete RIFT DATA catalog

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/worlds-radar.yml"
      - "backend/**"
      - "requirements.txt"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-generate all tournaments and positions
        run: python scripts/build_site_data.py 2>&1 | tee catalog-build.log

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload full chart catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-data-complete-catalog
          path: |
            docs/assets/*.png
            docs/data/catalog.json
            catalog-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
